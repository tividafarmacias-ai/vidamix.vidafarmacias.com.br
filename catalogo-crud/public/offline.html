<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fc" />
    <script src="/js/theme.js"></script>
    <title>Sem conexão | VidaMix Studio</title>
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/pwa.css" />
    <link rel="stylesheet" href="/app-shell.css" />
    <link rel="stylesheet" href="/theme.css" />
    <script type="module" src="/js/app-shell.js"></script>
    <script src="/js/pwa.js" defer></script>
  </head>
  <body class="offline-page">
    <header class="site-header" data-app-header>
      <div class="site-header-inner">
        <a class="site-brand" href="/" aria-label="VidaMix Studio — Central de criação">
          <img class="site-brand-logo" src="/branding/vida-horizontal.png" width="923" height="302" alt="Vida Farmácias" />
        </a>
      </div>
    </header>
    <main class="offline-card">
      <h1>Vamos reconectar?</h1>
      <p>Não foi possível conectar ao VidaMix Studio. Verifique sua conexão para acessar o catálogo e criar suas artes.</p>
      <button class="pwa-retry-button" type="button" data-pwa-retry>Tentar novamente</button>
    </main>
  </body>
</html>
